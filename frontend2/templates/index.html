<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Flask Frontend for Testing">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flask Frontend Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { padding-top: 50px; background-color: #f8f9fa; }
        .container { max-width: 800px; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Flask Frontend Test</h1>
        <p class="text-center text-muted">Testing alternative frontend (Flask + Jinja2)</p>

        <div class="row">
            <!-- Tab 1: List Files -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">📂 List Files</h5>
                    </div>
                    <div class="card-body">
                        <button id="btn-list" class="btn btn-outline-primary w-100 mb-3">Refresh List</button>
                        <div id="list-container" class="small">
                            <!-- File list will be injected here -->
                            <p class="text-muted">No data loaded.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Upload File -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">📤 Upload File</h5>
                    </div>
                    <div class="card-body">
                        <form id="upload-form">
                            <div class="mb-3">
                                <input type="file" name="file" id="file-input" class="form-control">
                            </div>
                            <button type="submit" id="btn-upload" class="btn btn-success w-100">Upload Now</button>
                        </form>
                        <div id="upload-status" class="mt-3 small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- List Files Logic ---
        const btnList = document.getElementById('btn-list');
        const listContainer = document.getElementById('list-container');

        btnList.addEventListener('click', async () => {
            listContainer.innerHTML = '<div class="spinner-border spinner-border-sm text-primary" role="status"></div> Fetching...';
            try {
                const response = await fetch('/api/list-files');
                const data = await response.json();

                if (data.error) {
                    listContainer.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                    return;
                }

                const files = data.files || [];
                if (files.length === 0) {
                    listContainer.innerHTML = '<p class="text-muted">No files found.</p>';
                } else {
                    let html = '<ul class="list-group list-group-flush">';
                    files.forEach(file => {
                        html += `<li class="list-group-item px-0">
                                    <strong>${file.name}</strong><br>
                                    <small class="text-muted">${file.size} bytes | ${new Date(file.last_modified).toLocaleString()}</small>
                                 </li>`;
                    });
                    html += '</ul>';
                    listContainer.innerHTML = html;
                }
            } catch (err) {
                listContainer.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
        });

        // --- Upload File Logic ---
        const uploadForm = document.getElementById('upload-form');
        const uploadStatus = document.getElementById('upload-status');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files[0]) {
                uploadStatus.innerHTML = '<div class="alert alert-warning">Please select a file first.</div>';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            uploadStatus.innerHTML = '<div class="spinner-border spinner-border-sm text-success" role="status"></div> Uploading...';

            try {
                const response = await fetch('/api/upload-file', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    uploadStatus.innerHTML = `<div class="alert alert-success">${data.message || 'Upload successful!'}</div>`;
                    fileInput.value = ''; // Clear input
                } else {
                    uploadStatus.innerHTML = `<div class="alert alert-danger">${data.error || 'Upload failed.'}</div>`;
                }
            } catch (err) {
                uploadStatus.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
